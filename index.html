<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Location Based Attendance System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Azure Maps -->
<link rel="stylesheet" href="https://atlas.microsoft.com/sdk/javascript/mapcontrol/2/atlas.min.css">
<script src="https://atlas.microsoft.com/sdk/javascript/mapcontrol/2/atlas.min.js"></script>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    align-items: center;
    justify-content: center;
}

.glass {
    width: 380px;
    padding: 30px;
    border-radius: 20px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(15px);
    box-shadow: 0 25px 60px rgba(0,0,0,0.3);
    color: #fff;
    display: none;
    animation: fadeIn 0.6s ease-in-out;
}

.glass.active {
    display: block;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

h2 {
    text-align: center;
    margin-bottom: 20px;
    font-weight: 600;
}

input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    margin-bottom: 15px;
    outline: none;
}

button {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, #43cea2, #185a9d);
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
}

button:hover {
    transform: scale(1.03);
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

.punch-out {
    margin-top: 10px;
    background: linear-gradient(135deg, #ff512f, #dd2476);
}

#map {
    width: 100%;
    height: 220px;
    margin-top: 15px;
    border-radius: 15px;
}

.status {
    margin-top: 10px;
    text-align: center;
    font-size: 14px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="glass active" id="loginBox">
    <h2>🔐 Employee Login</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <div class="status" id="loginStatus"></div>
</div>

<!-- ATTENDANCE -->
<div class="glass" id="attendanceBox">
    <h2 id="welcome"></h2>

    <button onclick="markAttendance('Punch In')">🟢 Punch In</button>
    <button class="punch-out" onclick="markAttendance('Punch Out')">🔴 Punch Out</button>

    <div id="map"></div>
    <div class="status" id="status"></div>
</div>

<script>
/*************** CONFIG ****************/
const AZURE_MAP_KEY = "29tQsOgaggLiWIY5lVfJ9pQ4MabgWEyAIcJSNCrUfEP1f33W6NDjJQQJ99AGACYeBjFd4FboAAAgAZMPZYdR";
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzhrNKU4L2vl6Tx-vcz30SSwsf7Sd6_yOk_DHVzq6RRXiIaKfnZTKDaGgtJ5xb7TuPQXw/exec";

/*************** USERS *****************/
const users = [
    { username: "swatzz", password: "1830", name: "SaraSwathy" },
    { username: "dev",  password: "1111", name: "Dev Anand Pole" },
    { username: "lokesh",  password: "2222", name: "Lokesh" },
    { username: "sandy", password: "2427", name: "Sandhiya D" },
    { username: "brindha", password: "1234", name: "Dr S Brindha"},
    { username: "suresh", password: "0000", name: "Dr suresh"}
];

/*************** LOGIN *****************/
function login() {
    const u = document.getElementById("username").value;
    const p = document.getElementById("password").value;

    const user = users.find(x => x.username === u && x.password === p);

    if (user) {
        document.getElementById("loginBox").classList.remove("active");
        document.getElementById("attendanceBox").classList.add("active");
        document.getElementById("welcome").innerText = "👋 Welcome, " + user.name;
        window.currentUser = user.name;
    } else {
        document.getElementById("loginStatus").innerText = "❌ Invalid credentials";
    }
}

/*************** MAP *******************/
let map, marker;

function initMap(lat, lon) {
    if (!map) {
        map = new atlas.Map("map", {
            center: [lon, lat],
            zoom: 16,
            authOptions: {
                authType: "subscriptionKey",
                subscriptionKey: AZURE_MAP_KEY
            }
        });

        map.events.add("ready", () => {
            marker = new atlas.HtmlMarker({ position: [lon, lat] });
            map.markers.add(marker);
        });
    } else {
        marker.setOptions({ position: [lon, lat] });
        map.setCamera({ center: [lon, lat] });
    }
}

/*************** ATTENDANCE ************/
function markAttendance(action) {
    document.getElementById("status").innerText = "📍 Fetching location...";

    navigator.geolocation.getCurrentPosition(
        pos => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            const now = new Date();

            initMap(lat, lon);

            fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    name: window.currentUser,
                    action: action,
                    date: now.toLocaleDateString(),
                    time: now.toLocaleTimeString(),
                    lat: lat,
                    lon: lon
                })
            });

            document.getElementById("status").innerText =
                "✅ " + action + " successful";
        },
        () => {
            document.getElementById("status").innerText =
                "❌ Location permission denied";
            alert("Please allow location access");
        },
        { enableHighAccuracy: true, timeout: 10000 }
    );
}
</script>

</body>
</html>
